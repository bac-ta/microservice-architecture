spring:
  application:
    name: gateway
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
  threads:
    virtual:
      # requests wait on blocking gRPC calls and long exports: cheap on virtual threads
      enabled: true
  mvc:
    async:
      # report downloads are written asynchronously
      request-timeout: ${GATEWAY_STREAM_DEADLINE:10m}
  # Mobile API: GraphQL generated from the protos (GraphQlConfiguration, MobileGraphQlSchema).
  # /api/m/graphql, GraphiQL /api/m/graphiql, SDL /api/m/graphql/schema
  graphql:
    path: /m/graphql
    graphiql:
      enabled: ${GATEWAY_API_DOCS_ENABLED:true}
      path: /m/graphiql
    schema:
      printer:
        enabled: ${GATEWAY_API_DOCS_ENABLED:true}
      introspection:
        enabled: ${GATEWAY_API_DOCS_ENABLED:true}
      # fields are wired in code, not by controllers
      inspection:
        enabled: false

server:
  port: ${HTTP_SERVER_PORT:5555}
  servlet:
    context-path: /api

# Swagger UI: /api/swagger-ui.html, OpenAPI document: /api/v3/api-docs (OpenApiConfiguration)
springdoc:
  api-docs:
    enabled: ${GATEWAY_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${GATEWAY_API_DOCS_ENABLED:true}
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

epl:
  gateway:
    # backend name -> gRPC target. The backend of an RPC is taken from its proto package
    # (epl.inventory.v1.StockService -> inventory). Kubernetes: dns:///inventory:9104
    backends:
      auth: ${GRPC_AUTH_TARGET:localhost:9101}
      masterdata: ${GRPC_MASTERDATA_TARGET:localhost:9102}
      inbound: ${GRPC_INBOUND_TARGET:localhost:9103}
      inventory: ${GRPC_INVENTORY_TARGET:localhost:9104}
      outbound: ${GRPC_OUTBOUND_TARGET:localhost:9105}
      billing: ${GRPC_BILLING_TARGET:localhost:9106}
      integration: ${GRPC_INTEGRATION_TARGET:localhost:9107}
      report: ${GRPC_REPORT_TARGET:localhost:9108}
    deadline: ${GATEWAY_DEADLINE:30s}
    stream-deadline: ${GATEWAY_STREAM_DEADLINE:10m}
    security:
      # false only for local development without the auth service
      enabled: ${GATEWAY_SECURITY_ENABLED:true}
      issuer: ${JWT_ISSUER:}
      jwks-cache-ttl: 5m
      public-paths:
        - /rpc/auth/v1/auth/login
        - /rpc/auth/v1/auth/refresh
        # the refresh token in the body is the credential: works after the access token expired
        - /rpc/auth/v1/auth/logout
        - /rpc/auth/v1/auth/get-jwks
        - /actuator/health/**
        # mobile GraphQL: a token is checked per field (Login, Refresh … are public, see MobileGraphQlSchema)
        - /m/graphql
        - /m/graphql/schema
        - /m/graphiql
        # Swagger UI / OpenAPI document (off with GATEWAY_API_DOCS_ENABLED=false)
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    graphql:
      # one request = at most this many backend calls (aliases included)
      max-rpc-calls: ${GRAPHQL_MAX_RPC_CALLS:20}
      max-depth: 15
      persisted-query-cache-size: 1000
      # server-to-server RPCs, not for screens
      exclude:
        - epl.auth.v1.AuthService/GetJwks
        - epl.auth.v1.TenantService/ResolveTenant
        - epl.auth.v1.AuthorizationService/Check
        - epl.auth.v1.AuthorizationService/BatchCheck

# request id of the call (x-request-id, set by the gateway) on every log line
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
