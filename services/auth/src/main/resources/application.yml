spring:
  application:
    name: auth

  # Runtime connection: DML only, subject to Row-Level Security (see database/README.md)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:epl}?currentSchema=iam
    username: ${DB_USERNAME:iam_app}
    password: ${DB_PASSWORD:}

  # Schema and roles come from database/bootstrap/bootstrap.sql. The running service only
  # validates its migrations; the "migrate" profile below applies them.
  flyway:
    schemas: iam
    default-schema: iam
    create-schemas: false
    locations: classpath:db/migration
    validate-migration-naming: true

  # Entities are checked against the Flyway schema at start-up; never generated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: iam
        jdbc.time_zone: UTC

  # Events (libs/messaging): written to outbox_event with the business change and published by the
  # outbox relay; topic = event type, consumer group = service name
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

server:
  port: ${HTTP_SERVER_PORT:8101}

# read by libs/grpc-server (GrpcServerProperties)
app:
  grpc:
    server:
      address: ${GRPC_SERVER_ADDRESS:0.0.0.0}
      port: ${GRPC_SERVER_PORT:9101}

epl:
  # read by libs/messaging: iam.outbox_event has no tenant_id
  messaging:
    outbox:
      tenant-column: false
  # read by AuthProperties; access / refresh token lifetimes are per client (iam.oauth_client)
  auth:
    token:
      # same value as the gateway's JWT_ISSUER
      issuer: ${JWT_ISSUER:epl-auth}
      # EC P-256 private key as a JWK (JSON) from the secret store; empty = new key on every start (local only)
      signing-key: ${JWT_SIGNING_KEY:}
    # first user, created while iam.app_user is empty; empty password = none
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# request id of the call (x-request-id, set by the gateway) on every log line
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

---
# Migrate job: applies pending migrations as the schema owner, then exits (no HTTP / gRPC server).
#   ./gradlew :services:auth:bootMigrate
#   java -jar auth.jar --spring.profiles.active=migrate
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  kafka:
    listener:
      auto-startup: false
  flyway:
    user: ${FLYWAY_USERNAME:iam_owner}
    password: ${FLYWAY_PASSWORD:}
    connect-retries: 10

app:
  grpc:
    server:
      enabled: false

epl:
  database:
    migration:
      mode: migrate
  messaging:
    relay:
      enabled: false
