spring:
  application:
    name: integration

  # Runtime connection: DML only, subject to Row-Level Security (see database/README.md)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:epl}
    username: ${DB_USERNAME:intg_app}
    password: ${DB_PASSWORD:}

  # Schema and roles come from database/bootstrap/bootstrap.sql. The running service only
  # validates its migrations; the "migrate" profile below applies them.
  flyway:
    schemas: intg
    default-schema: intg
    create-schemas: false
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${HTTP_SERVER_PORT:8107}

# read by libs/grpc-server (GrpcServerProperties)
app:
  grpc:
    server:
      address: ${GRPC_SERVER_ADDRESS:0.0.0.0}
      port: ${GRPC_SERVER_PORT:9107}

---
# Migrate job: applies pending migrations as the schema owner, then exits (no HTTP / gRPC server).
#   ./gradlew :services:integration:bootMigrate
#   java -jar integration.jar --spring.profiles.active=migrate
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    user: ${FLYWAY_USERNAME:intg_owner}
    password: ${FLYWAY_PASSWORD:}
    connect-retries: 10

app:
  grpc:
    server:
      enabled: false

epl:
  database:
    migration:
      mode: migrate
