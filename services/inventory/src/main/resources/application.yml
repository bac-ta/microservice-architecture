spring:
  application:
    name: inventory

  # Runtime connection: DML only, subject to Row-Level Security (see database/README.md)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:epl}?currentSchema=inv
    username: ${DB_USERNAME:inv_app}
    password: ${DB_PASSWORD:}

  # Schema and roles come from database/bootstrap/bootstrap.sql. The running service only
  # validates its migrations; the "migrate" profile below applies them.
  flyway:
    schemas: inv
    default-schema: inv
    create-schemas: false
    locations: classpath:db/migration
    validate-migration-naming: true

  # Entities are checked against the Flyway schema at start-up; never generated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inv
        jdbc.time_zone: UTC

  # Events (libs/messaging): written to outbox_event with the business change and published by the
  # outbox relay; topic = event type, consumer group = service name
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

server:
  port: ${HTTP_SERVER_PORT:8104}

# read by libs/grpc-server (GrpcServerProperties)
app:
  grpc:
    server:
      address: ${GRPC_SERVER_ADDRESS:0.0.0.0}
      port: ${GRPC_SERVER_PORT:9104}

# read by libs/service-core: tenant metadata (x-company / x-warehouse / x-customer) -> ids for RLS
epl:
  tenancy:
    auth-target: ${GRPC_AUTH_TARGET:dns:///localhost:9101}
  # read by libs/messaging: outbox relay (EPL_OUTBOX_RELAY_ENABLED=false stops publishing)
  messaging:
    relay:
      enabled: ${EPL_OUTBOX_RELAY_ENABLED:true}

---
# Migrate job: applies pending migrations as the schema owner, then exits (no HTTP / gRPC server).
#   ./gradlew :services:inventory:bootMigrate
#   java -jar inventory.jar --spring.profiles.active=migrate
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  kafka:
    listener:
      auto-startup: false
  flyway:
    user: ${FLYWAY_USERNAME:inv_owner}
    password: ${FLYWAY_PASSWORD:}
    connect-retries: 10

app:
  grpc:
    server:
      enabled: false

epl:
  database:
    migration:
      mode: migrate
  messaging:
    relay:
      enabled: false
