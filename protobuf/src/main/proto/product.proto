syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.example.core.autogen.grpc.product";
option java_multiple_files = true;

package Product;
// =================


message Product {
    int32 id = 1;
    string name = 2;
    Gender gender = 3;
    string email = 4;
    int32 age = 5;
    string phoneNumber = 6;
    int32 departmentId = 7;
}

message ProductSaving {
    string name = 1;
    Gender gender = 2;
    string email = 3;
    int32 age = 4;
    string phoneNumber = 5;
    int32 departmentId = 6;
}

enum Gender {
    MALE = 0;
    FEMALE = 1;
    OTHER = 2;
}

message ProductIdRequest {
    int32 id = 1;
}


message ProductResponses {
    repeated Product Product = 1;
}

message DepartmentIdRequest {
    int32 departmentId = 1;
}

service ProductService {
    rpc findProducts (google.protobuf.Empty) returns (ProductResponses);
    rpc findProductById (ProductIdRequest) returns (Product);
    rpc findProductByDepartmentId (DepartmentIdRequest) returns (ProductResponses);
    rpc saveProduct (ProductSaving) returns (google.protobuf.Empty);
    rpc removeProductById (ProductIdRequest) returns (google.protobuf.Empty);
}