// gRPC server bootstrap: @GrpcServer discovery, interceptor registry, server lifecycle,
// grpc.health.v1 health service and optional server reflection.
plugins {
    id 'epl.java-library'
}

dependencies {
    api libs.spring.boot.starter
    implementation libs.spring.boot.autoconfigure
    api libs.grpc.stub
    api libs.grpc.protobuf
    api libs.grpc.netty
    api libs.grpc.services
    annotationProcessor libs.spring.boot.configuration.processor
}
