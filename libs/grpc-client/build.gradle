// gRPC client support: @GrpcClient injection, channel factory, discovery-client name resolver.
plugins {
    id 'epl.java-library'
}

dependencies {
    api libs.spring.boot.starter
    implementation libs.spring.boot.autoconfigure
    implementation libs.spring.cloud.starter
    api libs.grpc.core
    api libs.grpc.util
    api libs.grpc.stub
    api libs.grpc.protobuf
    api libs.grpc.netty
}
