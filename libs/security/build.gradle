// Shared security for every service (formerly service-authentication, which never was a runnable service):
// gRPC auth/header/error interceptors, request context, password hashing, exception handling.
plugins {
    id 'epl.java-library'
}

dependencies {
    api libs.grpc.all
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.security
    implementation libs.spring.security.oauth2.legacy
    implementation libs.commons.lang3
    annotationProcessor libs.spring.boot.configuration.processor

    testImplementation libs.grpc.testing
}
