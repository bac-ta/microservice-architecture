syntax = "proto3";

// Outbound: shipping order → allocation → picking → packing → confirmation → result sending.
// Allocation reserves stock in the inventory service.
package epl.outbound.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option java_package = "com.epl.outbound.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Shipping orders
// ---------------------------------------------------------------------------
service ShipmentService {
  // screens: EPL-OB-110W
  rpc CreateShipment(CreateShipmentRequest) returns (Shipment);
  // screens: EPL-OB-120W, EPL-OB-120H
  rpc GetShipment(GetShipmentRequest) returns (Shipment);
  // screens: EPL-OB-120W, EPL-OB-120H
  rpc SearchShipments(SearchShipmentsRequest) returns (SearchShipmentsResponse);
  // Replaces header and lines while the shipment is ORDERED.
  // screens: EPL-OB-110W
  rpc UpdateShipment(UpdateShipmentRequest) returns (Shipment);
  // screens: EPL-OB-110W
  rpc CancelShipment(CancelShipmentRequest) returns (Shipment);
  // Only an ORDERED shipment; once allocated, cancel it instead.
  // screens: EPL-OB-110W
  rpc DeleteShipment(DeleteShipmentRequest) returns (google.protobuf.Empty);
  // screens: EPL-OB-510W
  rpc ConfirmShipment(ConfirmShipmentRequest) returns (ConfirmShipmentResponse);
  // screens: EPL-OB-520W
  rpc SendShipmentResult(SendShipmentResultRequest) returns (google.protobuf.Empty);
}

message ShipmentLine {
  int32 lineNo = 1;
  string status = 2;
  string productCode = 3;
  string productName = 4;
  string originCountry = 5;
  epl.common.v1.Quantity ordered = 6;
  epl.common.v1.Quantity allocated = 7;
  epl.common.v1.Quantity shipped = 8;
  string subInventoryCode = 9;
  epl.common.v1.PickKeys pickKeys = 10;  // requested lot / expiry, empty = any
  string allocationKind = 11;            // FIFO, FEFO, lot …
  bool notShippable = 12;
  int32 customerLineSeq = 13;
  string warehouseInstructions = 14;
  string deliveryNoteRemarks = 15;
  google.protobuf.Struct ext = 16;
}

message Shipment {
  string shipmentNo = 1;
  epl.common.v1.Date scheduledDate = 2;
  string transactionKind = 3;
  string status = 4;
  epl.common.v1.Date shippedDate = 5;
  epl.common.v1.Date confirmedDate = 6;
  string batchNo = 7;
  string totalPickingNo = 8;
  string invoiceNo = 9;
  string customerRef = 10;
  string poNo = 11;
  epl.common.v1.Party shipTo = 12;
  epl.common.v1.Party finalShipTo = 13;
  epl.common.v1.Party shipper = 14;       // SP_* (consignor)
  epl.common.v1.Party billTo = 15;
  string carrierCode = 16;
  string warehouseInstructions = 17;
  string deliveryNoteRemarks = 18;
  string waybillRemarks = 19;
  epl.common.v1.Decimal totalWeight = 20;
  epl.common.v1.Decimal totalVolume = 21;
  repeated ShipmentLine lines = 22;
  google.protobuf.Struct ext = 23;
  epl.common.v1.Audit audit = 24;
}

message CreateShipmentRequest {
  Shipment shipment = 1;
}

message GetShipmentRequest {
  string shipmentNo = 1;
}

message SearchShipmentsRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date scheduledFrom = 2;
  epl.common.v1.Date scheduledTo = 3;
  repeated string statuses = 4;
  string invoiceNo = 5;
  string customerRef = 6;
  string shipToCode = 7;
  string batchNo = 8;
  string productCode = 9;
}

message SearchShipmentsResponse {
  repeated Shipment shipments = 1;
  epl.common.v1.PageResponse page = 2;
}

message UpdateShipmentRequest {
  Shipment shipment = 1;  // identified by shipmentNo, audit.version required
}

message DeleteShipmentRequest {
  string shipmentNo = 1;
  int32 version = 2;
}

message CancelShipmentRequest {
  string shipmentNo = 1;
  string reasonCode = 2;
  int32 version = 3;
}

message ConfirmShipmentRequest {
  repeated string shipmentNos = 1;
  epl.common.v1.Date shippedDate = 2;
}

message ConfirmShipmentResponse {
  repeated Shipment shipments = 1;
  repeated epl.common.v1.RowError errors = 2;
}

message SendShipmentResultRequest {
  repeated string shipmentNos = 1;
  string channel = 2;  // EDI / CSV / MAIL
}

// ---------------------------------------------------------------------------
// Allocation (stock reservation)
// ---------------------------------------------------------------------------
service AllocationService {
  // screens: EPL-OB-210W
  rpc Allocate(AllocateRequest) returns (AllocateResponse);
  // screens: EPL-OB-210W
  rpc CancelAllocation(CancelAllocationRequest) returns (google.protobuf.Empty);
}

message AllocatedLot {
  int32 lineNo = 1;
  string stockId = 2;
  string locationCode = 3;
  epl.common.v1.PickKeys pickKeys = 4;
  epl.common.v1.Decimal qty = 5;
  string lotId = 6;  // inventory lot reserved
}

message AllocateRequest {
  repeated string shipmentNos = 1;
  bool allowPartial = 2;
}

message AllocateResponse {
  repeated AllocatedLot lots = 1;
  repeated epl.common.v1.RowError shortages = 2;
}

message CancelAllocationRequest {
  repeated string shipmentNos = 1;
}

// ---------------------------------------------------------------------------
// Picking
// ---------------------------------------------------------------------------
service PickingService {
  // screens: EPL-OB-310W
  rpc CreatePickingBatch(CreatePickingBatchRequest) returns (PickingBatch);
  // screens: EPL-OB-320H
  rpc RecordPick(RecordPickRequest) returns (RecordPickResponse);
}

message PickTask {
  string shipmentNo = 1;
  int32 lineNo = 2;
  string stockId = 3;
  string locationCode = 4;
  string productCode = 5;
  epl.common.v1.PickKeys pickKeys = 6;
  epl.common.v1.Decimal qty = 7;
  int32 pickingSequence = 8;
  string lotId = 9;
}

message PickingBatch {
  string batchNo = 1;
  string totalPickingNo = 2;
  repeated string shipmentNos = 3;
  repeated PickTask tasks = 4;  // ordered by location picking sequence
}

message CreatePickingBatchRequest {
  repeated string shipmentNos = 1;
  bool totalPicking = 2;  // one pick list for many orders
}

message RecordPickRequest {
  message Pick {
    string shipmentNo = 1;
    int32 lineNo = 2;
    string stockId = 3;
    string scannedLocation = 4;
    string scannedCargoId = 5;
    epl.common.v1.Decimal qty = 6;
  }
  repeated Pick picks = 1;
}

message RecordPickResponse {
  repeated epl.common.v1.RowError errors = 1;
}

// ---------------------------------------------------------------------------
// Packing
// ---------------------------------------------------------------------------
service PackingService {
  // screens: EPL-OB-410W, EPL-OB-410H
  rpc RecordPacking(RecordPackingRequest) returns (RecordPackingResponse);
  // screens: EPL-OB-420W, EPL-OB-420H
  rpc ListCartons(ListCartonsRequest) returns (ListCartonsResponse);
}

message Carton {
  string cartonId = 1;
  string shipmentNo = 2;
  string packingMaterialCode = 3;
  epl.common.v1.Decimal weight = 4;
  epl.common.v1.Decimal volume = 5;
  message Item {
    int32 lineNo = 1;
    string productCode = 2;
    epl.common.v1.PickKeys pickKeys = 3;
    epl.common.v1.Decimal qty = 4;
    repeated string serialNumbers = 5;
    string lotId = 6;
  }
  repeated Item items = 6;
}

message RecordPackingRequest {
  repeated Carton cartons = 1;
}

message RecordPackingResponse {
  repeated Carton cartons = 1;  // with generated carton ids
  repeated epl.common.v1.RowError errors = 2;
}

message ListCartonsRequest {
  string shipmentNo = 1;
}

message ListCartonsResponse {
  repeated Carton cartons = 1;
}
