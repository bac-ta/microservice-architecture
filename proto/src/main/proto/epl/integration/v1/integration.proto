syntax = "proto3";

// Integration: CSV / file uploads, EDI send & receive, outbound event re-send, data lifecycle jobs.
package epl.integration.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.epl.integration.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// File uploads (orders, masters, results)
// ---------------------------------------------------------------------------
service UploadService {
  // Client streams the file: first message carries the header, the rest carry bytes.
  // screens: EPL-IT-110W
  rpc Upload(stream UploadChunk) returns (UploadResult);
  // screens: EPL-IT-110W
  rpc GetUploadErrors(GetUploadErrorsRequest) returns (GetUploadErrorsResponse);
}

message UploadChunk {
  message Header {
    string fileKind = 1;  // ARRIVAL, SHIPMENT, PRODUCT …
    string fileName = 2;
    string contentType = 3;
    bool validateOnly = 4;
  }
  oneof part {
    Header header = 1;
    bytes data = 2;
  }
}

message UploadResult {
  string uploadId = 1;
  int32 acceptedRows = 2;
  int32 rejectedRows = 3;
  repeated epl.common.v1.RowError errors = 4;  // first N; full list via GetUploadErrors
}

message GetUploadErrorsRequest {
  string uploadId = 1;
  epl.common.v1.PageRequest page = 2;
}

message GetUploadErrorsResponse {
  repeated epl.common.v1.RowError errors = 1;
  epl.common.v1.PageResponse page = 2;
}

// ---------------------------------------------------------------------------
// EDI
// ---------------------------------------------------------------------------
service EdiService {
  // screens: EPL-IT-210W
  rpc Search(SearchEdiRequest) returns (SearchEdiResponse);
  // screens: EPL-IT-210W
  rpc Resend(ResendEdiRequest) returns (EdiMessage);
}

message EdiMessage {
  string id = 1;
  string direction = 2;  // SEND / RECEIVE
  string ediCode = 3;
  string partner = 4;
  string status = 5;     // OK, ERROR, PENDING
  string batchNo = 6;
  google.protobuf.Timestamp processedAt = 7;
  string errorMessage = 8;
  int32 recordCount = 9;
}

message SearchEdiRequest {
  epl.common.v1.PageRequest page = 1;
  string direction = 2;
  string ediCode = 3;
  repeated string statuses = 4;
  epl.common.v1.Date dateFrom = 5;
  epl.common.v1.Date dateTo = 6;
}

message SearchEdiResponse {
  repeated EdiMessage messages = 1;
  epl.common.v1.PageResponse page = 2;
}

message ResendEdiRequest {
  string id = 1;
  bool reprocess = 2;  // re-receive / re-run the import
}

// ---------------------------------------------------------------------------
// Batch jobs and data lifecycle
// ---------------------------------------------------------------------------
service JobService {
  // screens: EPL-IT-310W
  rpc ListJobDefinitions(google.protobuf.Empty) returns (ListJobDefinitionsResponse);
  // screens: EPL-IT-310W
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // screens: EPL-IT-310W
  rpc GetJob(GetJobRequest) returns (Job);
  // Queues a run; the worker of the job picks it up.
  // screens: EPL-IT-310W
  rpc CreateJob(CreateJobRequest) returns (Job);
  // Only a QUEUED run.
  // screens: EPL-IT-310W
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
  // screens: EPL-IT-320W
  rpc RunPurge(RunPurgeRequest) returns (Job);
  // screens: EPL-IT-320W
  rpc ListPurgeHistory(ListPurgeHistoryRequest) returns (ListPurgeHistoryResponse);
}

message JobDefinition {
  string code = 1;      // PURGE, EDI_RECEIVE …
  string name = 2;
  string schedule = 3;  // cron expression, informational
  bool enabled = 4;
  string description = 5;
}

message ListJobDefinitionsResponse {
  repeated JobDefinition definitions = 1;
}

message Job {
  string id = 1;
  string jobCode = 2;
  string status = 3;  // QUEUED, RUNNING, DONE, FAILED
  google.protobuf.Timestamp startedAt = 4;
  google.protobuf.Timestamp finishedAt = 5;
  string message = 6;
  google.protobuf.Struct parameters = 7;
  google.protobuf.Timestamp createdAt = 8;
  string createdBy = 9;
}

message GetJobRequest {
  string id = 1;
}

message CreateJobRequest {
  string jobCode = 1;
  google.protobuf.Struct parameters = 2;
}

message DeleteJobRequest {
  string id = 1;
}

message ListJobsRequest {
  epl.common.v1.PageRequest page = 1;
  string jobCode = 2;
  repeated string statuses = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  epl.common.v1.PageResponse page = 2;
}

message RunPurgeRequest {
  string tableGroup = 1;           // which data group to purge
  epl.common.v1.Date olderThan = 2;
  bool dryRun = 3;
}

message PurgeRecord {
  string tableName = 1;
  int64 deletedRows = 2;
  string result = 3;
  google.protobuf.Timestamp startedAt = 4;
  google.protobuf.Timestamp finishedAt = 5;
  string errorMessage = 6;
}

message ListPurgeHistoryRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date dateFrom = 2;
  epl.common.v1.Date dateTo = 3;
}

message ListPurgeHistoryResponse {
  repeated PurgeRecord records = 1;
  epl.common.v1.PageResponse page = 2;
}
