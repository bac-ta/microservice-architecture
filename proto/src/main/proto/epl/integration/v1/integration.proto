syntax = "proto3";

// Integration: CSV / file uploads, EDI send & receive, outbound event re-send, data lifecycle jobs.
// Legacy: gwh_lpupl / lpflb / lpedi / lpwes / lpbtj / lpddh (GwhSrvcLpWeb), GwhSrvcUpWeb (upupl, upeml, upsbc),
// gwh_mpedi / mpedm / mpeds (EDI masters), GwhSrvcDpWeb (dpmgr data purge).
package epl.integration.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.example.epl.integration.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// File uploads (orders, masters, results)
// ---------------------------------------------------------------------------
service UploadService {
  // Client streams the file: first message carries the header, the rest carry bytes.
  // legacy: gwh_lpupl_010..110 / *Upd (FILE_KND 01..57), gwh_lpflb_010, gwh_upupl
  rpc Upload(stream UploadChunk) returns (UploadResult);
  // legacy: gwh_lpupl_020 / GWH_TJ_EE (upload error list)
  rpc GetUploadErrors(GetUploadErrorsRequest) returns (GetUploadErrorsResponse);
}

message UploadChunk {
  message Header {
    string file_kind = 1;  // legacy FILE_KND: 01 arrival, 02 shipment, 03 product …
    string file_name = 2;
    string content_type = 3;
    bool validate_only = 4;
  }
  oneof part {
    Header header = 1;
    bytes data = 2;
  }
}

message UploadResult {
  string upload_id = 1;
  int32 accepted_rows = 2;
  int32 rejected_rows = 3;
  repeated epl.common.v1.RowError errors = 4;  // first N; full list via GetUploadErrors
}

message GetUploadErrorsRequest {
  string upload_id = 1;
  epl.common.v1.PageRequest page = 2;
}

message GetUploadErrorsResponse {
  repeated epl.common.v1.RowError errors = 1;
  epl.common.v1.PageResponse page = 2;
}

// ---------------------------------------------------------------------------
// EDI
// ---------------------------------------------------------------------------
service EdiService {
  // legacy: gwh_lpedi_010 / gwhLpedi010Get, GetEdidDat (GWH_TJ_EDI_H / EDI_D, GWH_TJ_ER)
  rpc Search(SearchEdiRequest) returns (SearchEdiResponse);
  // legacy: gwh_lpedi_010 / *Snd, *Rec, *Rer; gwh_lpwes_010 / gwhLpwes010Snd (GWES_HIS re-send)
  rpc Resend(ResendEdiRequest) returns (EdiMessage);
}

message EdiMessage {
  string id = 1;
  string direction = 2;  // SEND / RECEIVE
  string edi_code = 3;   // GWH_TM_EDIC
  string partner = 4;
  string status = 5;     // OK, ERROR, PENDING
  string batch_no = 6;
  google.protobuf.Timestamp processed_at = 7;
  string error_message = 8;
  int32 record_count = 9;
}

message SearchEdiRequest {
  epl.common.v1.PageRequest page = 1;
  string direction = 2;
  string edi_code = 3;
  repeated string statuses = 4;
  epl.common.v1.Date date_from = 5;
  epl.common.v1.Date date_to = 6;
}

message SearchEdiResponse {
  repeated EdiMessage messages = 1;
  epl.common.v1.PageResponse page = 2;
}

message ResendEdiRequest {
  string id = 1;
  bool reprocess = 2;  // re-receive / re-run the import
}

// ---------------------------------------------------------------------------
// Batch jobs and data lifecycle
// ---------------------------------------------------------------------------
service JobService {
  // legacy: gwh_lpbtj_010 (GWH_TJ_BJST batch job status)
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // legacy: gwh_dpmgr_010 / gwhDpmgr010Exe (data purge)
  rpc RunPurge(RunPurgeRequest) returns (Job);
  // legacy: gwh_lpddh_010, gwh_dpmgr_020 (GWH_TJ_DDH purge history)
  rpc ListPurgeHistory(ListPurgeHistoryRequest) returns (ListPurgeHistoryResponse);
}

message Job {
  string id = 1;
  string job_code = 2;
  string status = 3;  // QUEUED, RUNNING, DONE, FAILED
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  string message = 6;
}

message ListJobsRequest {
  epl.common.v1.PageRequest page = 1;
  string job_code = 2;
  repeated string statuses = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  epl.common.v1.PageResponse page = 2;
}

message RunPurgeRequest {
  string table_group = 1;           // which data group to purge
  epl.common.v1.Date older_than = 2;
  bool dry_run = 3;
}

message PurgeRecord {
  string table_name = 1;
  int64 deleted_rows = 2;
  string result = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  string error_message = 6;
}

message ListPurgeHistoryRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date date_from = 2;
  epl.common.v1.Date date_to = 3;
}

message ListPurgeHistoryResponse {
  repeated PurgeRecord records = 1;
  epl.common.v1.PageResponse page = 2;
}
