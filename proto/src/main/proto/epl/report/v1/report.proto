syntax = "proto3";

// Reports, document printing, labels and KPIs.
// Legacy: GwhSrvcRpWeb (≈60 rp* report screens), GwhSrvcRbWeb (rbcid cargo-ID labels on HHT),
// GwhEasWeb, GwhSrvcKpWeb (kpstr inventory turnover); NCU print forms TMNCUPRT*.
// Reads data from the other services; owns only report definitions and print history.
package epl.report.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/struct.proto";

option java_package = "com.example.epl.report.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Reports and documents
// ---------------------------------------------------------------------------
service ReportService {
  // legacy: report list per process (GWH_TM_RPT / RPTP / RPTC)
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  // legacy: gwh_rp*_010 screens, e.g. rpain (arrival inspection list), rpinv (inventory),
  //         rppks (picking list), rpdvn (delivery note), rpstk (stocktake sheet), rpwcs (charge statement)
  // Streams the rendered file in chunks.
  rpc Render(RenderRequest) returns (stream FileChunk);
}

message ReportDefinition {
  string code = 1;          // e.g. RPPKS
  string name = 2;
  string process_code = 3;  // which business step offers it
  repeated string formats = 4;  // PDF, XLSX, CSV
  repeated string parameters = 5;
}

message ListReportsRequest {
  string process_code = 1;
}

message ListReportsResponse {
  repeated ReportDefinition reports = 1;
}

message RenderRequest {
  string report_code = 1;
  string format = 2;  // PDF / XLSX / CSV
  google.protobuf.Struct parameters = 3;
  string locale = 4;
}

message FileChunk {
  string file_name = 1;     // set on the first chunk
  string content_type = 2;  // set on the first chunk
  bytes data = 3;
}

// ---------------------------------------------------------------------------
// Labels (cargo ID, product, carton) on label printers
// ---------------------------------------------------------------------------
service LabelService {
  // legacy: gwh_rbcid (HHT cargo-ID label), gwh_rpcid / rplbp (PC labels), TMNCUPRTPRTPAIRMST
  rpc PrintLabels(PrintLabelsRequest) returns (PrintLabelsResponse);
}

message PrintLabelsRequest {
  string label_code = 1;  // CARGO_ID, PRODUCT, CARTON …
  string printer_id = 2;  // empty = printer paired with the calling device
  repeated google.protobuf.Struct items = 3;
  int32 copies = 4;
}

message PrintLabelsResponse {
  string print_job_id = 1;
  int32 printed = 2;
}

// ---------------------------------------------------------------------------
// KPIs
// ---------------------------------------------------------------------------
service KpiService {
  // legacy: gwh_kpstr_010 / gwhKpstr010Get (inventory turnover rate)
  rpc GetInventoryTurnover(GetInventoryTurnoverRequest) returns (GetInventoryTurnoverResponse);
}

message GetInventoryTurnoverRequest {
  epl.common.v1.Date date_from = 1;
  epl.common.v1.Date date_to = 2;
  string product_group_code = 3;
}

message TurnoverRow {
  string product_code = 1;
  epl.common.v1.Decimal average_stock = 2;
  epl.common.v1.Decimal shipped_qty = 3;
  epl.common.v1.Decimal turnover_rate = 4;
  epl.common.v1.Decimal days_on_hand = 5;
}

message GetInventoryTurnoverResponse {
  repeated TurnoverRow rows = 1;
}
