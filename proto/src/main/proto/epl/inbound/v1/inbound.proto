syntax = "proto3";

// Inbound: arrival plan → inspection → put-away → confirmation.
// Confirmed receipts create stock in the inventory service (event inbound.arrival.confirmed).
package epl.inbound.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option java_package = "com.epl.inbound.v1";
option java_multiple_files = true;

service ArrivalService {
  // screens: EPL-IB-110W, EPL-IB-110H
  rpc CreateArrival(CreateArrivalRequest) returns (Arrival);
  // screens: EPL-IB-120W, EPL-IB-120H
  rpc GetArrival(GetArrivalRequest) returns (Arrival);
  // screens: EPL-IB-120W, EPL-IB-120H
  rpc SearchArrivals(SearchArrivalsRequest) returns (SearchArrivalsResponse);
  // Replaces header and lines while the arrival is PLANNED.
  // screens: EPL-IB-110W
  rpc UpdateArrival(UpdateArrivalRequest) returns (Arrival);
  // screens: EPL-IB-110W
  rpc CancelArrival(CancelArrivalRequest) returns (Arrival);
  // Only a PLANNED arrival; once work started, cancel it instead.
  // screens: EPL-IB-110W
  rpc DeleteArrival(DeleteArrivalRequest) returns (google.protobuf.Empty);
  // screens: EPL-IB-210W, EPL-IB-210H
  rpc RecordInspection(RecordInspectionRequest) returns (RecordInspectionResponse);
  // screens: EPL-IB-220H
  rpc RecordPutaway(RecordPutawayRequest) returns (RecordPutawayResponse);
  // screens: EPL-IB-310W
  rpc ConfirmArrival(ConfirmArrivalRequest) returns (Arrival);
  // screens: EPL-IB-230W
  rpc RegisterSerials(RegisterSerialsRequest) returns (google.protobuf.Empty);
  // screens: EPL-IB-320W
  rpc SendArrivalResult(SendArrivalResultRequest) returns (google.protobuf.Empty);
}

message ArrivalLine {
  int32 lineNo = 1;
  string status = 2;
  bool inspected = 3;
  string productCode = 4;
  string productName = 5;
  string originCountry = 6;
  string supplierProductCode = 7;
  epl.common.v1.Quantity planned = 8;
  epl.common.v1.Quantity received = 9;  // sum of recorded results
  string subInventoryCode = 10;
  epl.common.v1.PickKeys pickKeys = 11;
  bool onHold = 12;
  int32 customerLineSeq = 13;
  string remarks = 14;
  google.protobuf.Struct ext = 15;      // CIT / COIL customer fields
}

message Arrival {
  string arrivalNo = 1;
  epl.common.v1.Date scheduledDate = 2;
  string transactionKind = 3;
  string status = 4;
  epl.common.v1.Date arrivedDate = 5;
  epl.common.v1.Date confirmedDate = 6;
  string invoiceNo = 7;
  string customerRef = 8;
  string poNo = 9;
  epl.common.v1.Party supplier = 10;
  bool bonded = 11;
  string blNo = 12;
  string containerNo = 13;
  string transportCode = 14;
  string returnShipmentNo = 15;         // returns
  string remarks = 16;
  repeated ArrivalLine lines = 17;
  google.protobuf.Struct ext = 18;
  epl.common.v1.Audit audit = 19;
}

message CreateArrivalRequest {
  Arrival arrival = 1;  // arrivalNo empty = numbered by the server
}

message GetArrivalRequest {
  string arrivalNo = 1;
}

message SearchArrivalsRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date scheduledFrom = 2;
  epl.common.v1.Date scheduledTo = 3;
  repeated string statuses = 4;
  string invoiceNo = 5;
  string customerRef = 6;
  string productCode = 7;
  string supplierCode = 8;
}

message SearchArrivalsResponse {
  repeated Arrival arrivals = 1;  // headers only (lines empty)
  epl.common.v1.PageResponse page = 2;
}

message UpdateArrivalRequest {
  Arrival arrival = 1;  // identified by arrivalNo, audit.version required
}

message DeleteArrivalRequest {
  string arrivalNo = 1;
  int32 version = 2;
}

message CancelArrivalRequest {
  string arrivalNo = 1;
  string reasonCode = 2;
  int32 version = 3;
}

message InspectionResult {
  int32 lineNo = 1;
  epl.common.v1.Quantity quantity = 2;
  epl.common.v1.PickKeys pickKeys = 3;  // actual lot / expiry
  string subInventoryCode = 4;
  bool onHold = 5;
  string cargoId = 6;                   // pallet / cargo label scanned on HHT
}

message RecordInspectionRequest {
  string arrivalNo = 1;
  repeated InspectionResult results = 2;
  bool allowSurplus = 3;   // needs a transaction kind that allows surplus
  bool allowShortage = 4;  // needs a transaction kind that allows shortage
}

message RecordInspectionResponse {
  Arrival arrival = 1;
  repeated epl.common.v1.RowError errors = 2;
}

message Putaway {
  string cargoId = 1;
  int32 lineNo = 2;
  string locationCode = 3;
  epl.common.v1.Quantity quantity = 4;
}

message RecordPutawayRequest {
  string arrivalNo = 1;
  repeated Putaway putaways = 2;
}

message RecordPutawayResponse {
  repeated epl.common.v1.RowError errors = 1;
}

message ConfirmArrivalRequest {
  string arrivalNo = 1;
  epl.common.v1.Date arrivedDate = 2;
  int32 version = 3;
}

message RegisterSerialsRequest {
  string arrivalNo = 1;
  int32 lineNo = 2;
  repeated string serialNumbers = 3;
}

message SendArrivalResultRequest {
  repeated string arrivalNos = 1;
  string channel = 2;  // EDI / CSV / MAIL
}
