syntax = "proto3";

// IAM: login / JWT, users and tenant grants, tenant registry, ABAC authorization.
// Schema: iam (services/auth/src/main/resources/db/migration).
package epl.auth.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.example.epl.auth.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Authentication
// ---------------------------------------------------------------------------
service AuthService {
  // screens: EPL-SY-010W, EPL-SY-010H
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Refresh(RefreshRequest) returns (TokenResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  // Public keys for local JWT verification by every service.
  rpc GetJwks(google.protobuf.Empty) returns (JwksResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string client_id = 3;  // PC_WEB, HHT, API …
}

message RefreshRequest {
  string refresh_token = 1;
  string client_id = 2;
}

message LogoutRequest {
  string refresh_token = 1;
  bool all_sessions = 2;  // bump token_version: invalidates every issued JWT
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in_seconds = 3;
  string token_type = 4;  // "Bearer"
  bool must_change_password = 5;
}

message JwksResponse {
  string jwks_json = 1;  // RFC 7517 JSON Web Key Set
}

// ---------------------------------------------------------------------------
// Users and tenant grants
// ---------------------------------------------------------------------------
service UserService {
  // screens: EPL-SY-110W
  rpc CreateUser(CreateUserRequest) returns (User);
  // screens: EPL-SY-110W
  rpc GetUser(GetUserRequest) returns (User);
  // screens: EPL-SY-110W
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // screens: EPL-SY-110W
  rpc UpdateUser(User) returns (User);
  // screens: EPL-SY-110W
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  // screens: EPL-SY-130W
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
  // screens: EPL-SY-120W
  rpc GrantTenant(GrantTenantRequest) returns (TenantGrant);
  // screens: EPL-SY-120W
  rpc RevokeGrant(RevokeGrantRequest) returns (google.protobuf.Empty);
  // screens: EPL-SY-120W
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
}

enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_INTERNAL = 1;  // warehouse operator staff
  USER_TYPE_CUSTOMER = 2;  // shipper's staff
  USER_TYPE_SYSTEM = 3;    // machine client
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_LOCKED = 2;
  USER_STATUS_DISABLED = 3;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  UserType type = 5;
  UserStatus status = 6;
  string home_company_code = 7;
  string home_customer_code = 8;
  string department_code = 9;
  string locale = 10;
  string time_zone = 11;
  map<string, string> attributes = 12;  // ABAC subject attributes (auth_level, max_adjust_qty …)
  google.protobuf.Timestamp last_login_at = 13;
  epl.common.v1.Audit audit = 14;
}

message CreateUserRequest {
  User user = 1;
  string initial_password = 2;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  epl.common.v1.PageRequest page = 1;
  string query = 2;  // username / name contains
  UserType type = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  epl.common.v1.PageResponse page = 2;
}

message DeleteUserRequest {
  string id = 1;
  int32 version = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

// "*" (empty) warehouse / customer = all within the company.
message TenantGrant {
  string id = 1;
  string user_id = 2;
  string company_code = 3;
  string warehouse_code = 4;
  string customer_code = 5;
  string role_code = 6;
  epl.common.v1.Date valid_from = 7;
  epl.common.v1.Date valid_to = 8;
}

message GrantTenantRequest {
  TenantGrant grant = 1;
}

message RevokeGrantRequest {
  string grant_id = 1;
}

message ListGrantsRequest {
  string user_id = 1;
}

message ListGrantsResponse {
  repeated TenantGrant grants = 1;
}

// ---------------------------------------------------------------------------
// Tenant registry (company / warehouse / customer / tenant)
// ---------------------------------------------------------------------------
service TenantService {
  // screens: EPL-SY-210W
  rpc ListCompanies(google.protobuf.Empty) returns (ListCompaniesResponse);
  // screens: EPL-SY-210W
  rpc GetCompany(GetCompanyRequest) returns (Company);
  // screens: EPL-SY-210W
  rpc CreateCompany(Company) returns (Company);
  // screens: EPL-SY-210W
  rpc UpdateCompany(Company) returns (Company);
  // screens: EPL-SY-210W
  rpc DeleteCompany(DeleteCompanyRequest) returns (google.protobuf.Empty);

  // screens: EPL-SY-210W
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
  // screens: EPL-SY-210W
  rpc GetWarehouse(GetWarehouseRequest) returns (Warehouse);
  // screens: EPL-SY-210W
  rpc CreateWarehouse(Warehouse) returns (Warehouse);
  // screens: EPL-SY-210W
  rpc UpdateWarehouse(Warehouse) returns (Warehouse);
  // screens: EPL-SY-210W
  rpc DeleteWarehouse(DeleteWarehouseRequest) returns (google.protobuf.Empty);

  // screens: EPL-SY-210W
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  // screens: EPL-SY-210W
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  // screens: EPL-SY-210W
  rpc CreateCustomer(Customer) returns (Customer);
  // screens: EPL-SY-210W
  rpc UpdateCustomer(Customer) returns (Customer);
  // screens: EPL-SY-210W
  rpc DeleteCustomer(DeleteCustomerRequest) returns (google.protobuf.Empty);

  // screens: EPL-SY-020W, EPL-SY-020H, EPL-SY-210W
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // screens: EPL-SY-210W
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  // screens: EPL-SY-220W
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  // screens: EPL-SY-210W
  rpc UpdateTenant(Tenant) returns (Tenant);
  // screens: EPL-SY-210W
  rpc DeleteTenant(DeleteTenantRequest) returns (google.protobuf.Empty);

  // Turns the tenant metadata (x-company, x-warehouse, x-customer) into ids for Row-Level Security.
  // Called by every service (cached), not by screens.
  rpc ResolveTenant(ResolveTenantRequest) returns (ResolvedTenant);
}

// Registry status of a company, warehouse, customer or tenant: ACTIVE, SUSPENDED, CLOSED
// (tenant also ONBOARDING).

message Company {
  string id = 1;
  string code = 2;  // e.g. C001, immutable
  string name = 3;
  string country_code = 4;
  string time_zone = 5;
  string status = 6;
  epl.common.v1.Audit audit = 7;
}

message Warehouse {
  string id = 1;
  string company_code = 2;
  string code = 3;  // e.g. WH01, unique within the company, immutable
  string name = 4;
  string time_zone = 5;
  string status = 6;
  epl.common.v1.Date start_date = 7;
  epl.common.v1.Date end_date = 8;
  epl.common.v1.Audit audit = 9;
}

// Shipper / owner of the goods, unique within a company.
message Customer {
  string id = 1;
  string company_code = 2;
  string code = 3;  // e.g. CUST01, immutable
  string name = 4;
  string status = 5;
  epl.common.v1.Audit audit = 6;
}

message Tenant {
  string id = 1;
  string company_code = 2;
  string warehouse_code = 3;
  string customer_code = 4;  // e.g. CUST01
  string customer_name = 5;
  string status = 6;
  epl.common.v1.Date start_date = 7;
  epl.common.v1.Date end_date = 8;
  epl.common.v1.Audit audit = 9;
}

message GetCompanyRequest {
  string code = 1;
}

message DeleteCompanyRequest {
  string code = 1;
  int32 version = 2;
}

message GetWarehouseRequest {
  string company_code = 1;
  string code = 2;
}

message DeleteWarehouseRequest {
  string company_code = 1;
  string code = 2;
  int32 version = 3;
}

message ListCustomersRequest {
  string company_code = 1;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
}

message GetCustomerRequest {
  string company_code = 1;
  string code = 2;
}

message DeleteCustomerRequest {
  string company_code = 1;
  string code = 2;
  int32 version = 3;
}

message GetTenantRequest {
  string id = 1;
}

message DeleteTenantRequest {
  string id = 1;
  int32 version = 2;
}

// Empty warehouse / customer = resolve only up to the company / warehouse.
message ResolveTenantRequest {
  string company_code = 1;
  string warehouse_code = 2;
  string customer_code = 3;
}

// Ids for app.company_id / app.warehouse_id / app.customer_id / app.tenant_id; empty when not requested.
message ResolvedTenant {
  string company_id = 1;
  string warehouse_id = 2;
  string customer_id = 3;
  string tenant_id = 4;
}

message ListCompaniesResponse {
  repeated Company companies = 1;
}

message ListWarehousesRequest {
  string company_code = 1;
}

message ListWarehousesResponse {
  repeated Warehouse warehouses = 1;
}

message ListTenantsRequest {
  string company_code = 1;
  string warehouse_code = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message CreateTenantRequest {
  string company_code = 1;
  string warehouse_code = 2;
  string customer_code = 3;
  string customer_name = 4;
  string copy_config_from_tenant_id = 5;  // optional template tenant
}

// ---------------------------------------------------------------------------
// Roles (named bundles of responsibilities, granted per tenant)
// ---------------------------------------------------------------------------
service RoleService {
  // screens: EPL-SY-120W, EPL-SY-140W
  rpc ListRoles(google.protobuf.Empty) returns (ListRolesResponse);
  // screens: EPL-SY-140W
  rpc UpsertRole(Role) returns (Role);
  // screens: EPL-SY-140W
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
}

message Role {
  string code = 1;  // UPPER_SNAKE, e.g. WMS_OPERATOR
  string name = 2;
  string description = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message DeleteRoleRequest {
  string code = 1;
}

// ---------------------------------------------------------------------------
// ABAC authorization (policy decision point + policy administration)
// ---------------------------------------------------------------------------
service AuthorizationService {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc BatchCheck(BatchCheckRequest) returns (BatchCheckResponse);
  // screens: EPL-SY-310W
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // screens: EPL-SY-310W
  rpc UpsertPolicy(Policy) returns (Policy);
  // screens: EPL-SY-310W
  rpc DeletePolicy(DeletePolicyRequest) returns (google.protobuf.Empty);
}

message CheckRequest {
  string resource_type = 1;                     // inventory.stock
  string action = 2;                            // adjust
  string resource_id = 3;
  map<string, string> resource_attributes = 4;  // bonded=true, qty=12 …
}

message CheckResponse {
  bool allowed = 1;
  repeated string policy_ids = 2;
  string reason = 3;
}

message BatchCheckRequest {
  repeated CheckRequest checks = 1;
}

message BatchCheckResponse {
  repeated CheckResponse results = 1;  // same order as the request
}

enum Effect {
  EFFECT_UNSPECIFIED = 0;
  EFFECT_PERMIT = 1;
  EFFECT_DENY = 2;
}

message Policy {
  string id = 1;
  string code = 2;
  string description = 3;
  Effect effect = 4;
  string company_code = 5;     // empty = '*'
  string warehouse_code = 6;   // empty = '*'
  string customer_code = 7;    // empty = '*'
  string resource_type = 8;
  repeated string actions = 9; // "*" = all
  string condition = 10;       // CEL expression
  int32 priority = 11;
  bool enabled = 12;
  epl.common.v1.Audit audit = 13;
}

message ListPoliciesRequest {
  string resource_type = 1;
  epl.common.v1.PageRequest page = 2;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
  epl.common.v1.PageResponse page = 2;
}

message DeletePolicyRequest {
  string id = 1;
}
