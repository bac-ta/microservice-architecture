syntax = "proto3";

// Master data: locations, products, sub-inventories, parties and scoped configuration.
// Schema: md.
package epl.masterdata.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option java_package = "com.example.epl.masterdata.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Areas and locations (warehouse-scoped, shared by all customers)
// ---------------------------------------------------------------------------
service LocationService {
  // screens: EPL-MD-110W
  rpc ListAreas(ListAreasRequest) returns (ListAreasResponse);
  // screens: EPL-MD-110W
  rpc GetArea(GetAreaRequest) returns (Area);
  // screens: EPL-MD-110W
  rpc UpsertArea(Area) returns (Area);
  // screens: EPL-MD-110W
  rpc DeleteArea(DeleteAreaRequest) returns (google.protobuf.Empty);
  // screens: EPL-MD-120W
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse);
  // screens: EPL-MD-120W
  rpc GetLocation(GetLocationRequest) returns (Location);
  // screens: EPL-MD-120W
  rpc UpsertLocation(Location) returns (Location);
  // screens: EPL-MD-120W
  rpc DeleteLocation(DeleteLocationRequest) returns (google.protobuf.Empty);
}

message Area {
  string code = 1;
  string name = 2;
  string temperatureKind = 3;
  string pickingGroupCode = 4;
  bool noAllocation = 5;
  bool noReplenishment = 6;
  bool singleProductOnly = 7;
  bool singlePickKeyOnly = 8;
  bool locked = 9;
  epl.common.v1.Audit audit = 10;
}

message GetAreaRequest {
  string code = 1;
}

// Areas and locations are soft-deleted: stock and history keep their codes.
message DeleteAreaRequest {
  string code = 1;
  int32 version = 2;
}

message ListAreasRequest {
  epl.common.v1.PageRequest page = 1;
}

message ListAreasResponse {
  repeated Area areas = 1;
  epl.common.v1.PageResponse page = 2;
}

message Location {
  string code = 1;  // area+rack+position+level, max 18
  string areaCode = 2;
  string rackCode = 3;
  string positionCode = 4;
  string levelCode = 5;
  string zoneCode = 6;
  bool noAllocation = 7;
  bool noReplenishment = 8;
  bool singleProductOnly = 9;
  bool singlePickKeyOnly = 10;
  int32 allocationPriority = 11;
  int32 pickingSequence = 12;
  string dedicatedProductCode = 13;
  string subInventoryCode = 14;
  string bondKind = 15;
  string temperatureControl = 16;
  string remarks = 17;
  google.protobuf.Struct ext = 18;
  epl.common.v1.Audit audit = 19;
}

message ListLocationsRequest {
  epl.common.v1.PageRequest page = 1;
  string areaCode = 2;
  string codeFrom = 3;
  string codeTo = 4;
  bool onlyEmpty = 5;  // no stock (asks inventory service)
}

message ListLocationsResponse {
  repeated Location locations = 1;
  epl.common.v1.PageResponse page = 2;
}

message GetLocationRequest {
  string code = 1;
}

message DeleteLocationRequest {
  string code = 1;
  int32 version = 2;
}

// ---------------------------------------------------------------------------
// Products and barcodes (tenant-scoped)
// ---------------------------------------------------------------------------
service ProductService {
  // screens: EPL-MD-210W, EPL-MD-210H
  rpc GetProduct(GetProductRequest) returns (Product);
  // screens: EPL-MD-210W
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  // screens: EPL-MD-210W
  rpc UpsertProduct(Product) returns (Product);
  // screens: EPL-MD-210W
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);
  rpc ResolveBarcode(ResolveBarcodeRequest) returns (ResolveBarcodeResponse);
}

message Packing {
  int32 unitsPerCase = 1;
  int32 unitsPerBall = 2;
  int32 casesPerPallet = 3;
  string uomPiece = 4;
  string uomCase = 5;
  string uomBall = 6;
  epl.common.v1.Decimal caseWeight = 7;
  epl.common.v1.Decimal caseVolume = 8;
  epl.common.v1.Decimal pieceWeight = 9;
  epl.common.v1.Decimal pieceVolume = 10;
}

message Product {
  string code = 1;
  repeated string names = 2;  // NAM1..NAM4
  string productGroupCode = 3;
  repeated string hierarchy = 4;
  Packing packing = 5;
  string storageKind = 6;
  string abcClass = 7;
  string expiryKind = 8;
  int32 expiryDays = 9;
  bool notShippable = 10;
  bool isKitParent = 11;
  string hsCode = 12;
  string bondKind = 13;
  string originCountry = 14;
  string recommendedLocation = 15;
  repeated string barcodes = 16;
  google.protobuf.Struct ext = 17;
  epl.common.v1.Audit audit = 18;
}

message GetProductRequest {
  string code = 1;
}

message ListProductsRequest {
  epl.common.v1.PageRequest page = 1;
  string query = 2;  // code or name contains
  string productGroupCode = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  epl.common.v1.PageResponse page = 2;
}

message DeleteProductRequest {
  string code = 1;
  int32 version = 2;
}

message ResolveBarcodeRequest {
  string barcode = 1;
}

message ResolveBarcodeResponse {
  Product product = 1;
  string uomLevel = 2;  // PIECE / BALL / CASE / PALLET
}

// ---------------------------------------------------------------------------
// Parties: delivery destinations, suppliers
// ---------------------------------------------------------------------------
service PartyService {
  // screens: EPL-MD-310W
  rpc ListDeliveryDestinations(ListPartiesRequest) returns (ListPartiesResponse);
  // screens: EPL-MD-320W
  rpc ListSuppliers(ListPartiesRequest) returns (ListPartiesResponse);
}

message ListPartiesRequest {
  epl.common.v1.PageRequest page = 1;
  string query = 2;
}

message ListPartiesResponse {
  repeated epl.common.v1.Party parties = 1;
  epl.common.v1.PageResponse page = 2;
}

// ---------------------------------------------------------------------------
// Scoped configuration (company / warehouse / customer, most specific wins)
// ---------------------------------------------------------------------------
service ConfigService {
  // screens: EPL-MD-410W
  rpc ListSubInventories(google.protobuf.Empty) returns (ListSubInventoriesResponse);
  // screens: EPL-MD-410W
  rpc UpsertSubInventory(SubInventory) returns (SubInventory);
  // screens: EPL-MD-410W
  rpc DeleteSubInventory(DeleteSubInventoryRequest) returns (google.protobuf.Empty);
  // screens: EPL-MD-420W
  rpc ListPickingKeyDefinitions(google.protobuf.Empty) returns (ListPickingKeyDefinitionsResponse);
  // screens: EPL-MD-430W
  rpc ListTransactionKinds(ListTransactionKindsRequest) returns (ListTransactionKindsResponse);
  // screens: EPL-MD-440W
  rpc ListStatuses(ListStatusesRequest) returns (ListStatusesResponse);
  // screens: EPL-MD-450W
  rpc ListCodes(ListCodesRequest) returns (ListCodesResponse);
  // screens: EPL-MD-460W
  rpc GetEffectiveSettings(GetEffectiveSettingsRequest) returns (GetEffectiveSettingsResponse);
}

message SubInventory {
  string code = 1;
  string name = 2;
  bool isDefault = 3;
}

message DeleteSubInventoryRequest {
  string code = 1;
}

message ListSubInventoriesResponse {
  repeated SubInventory subInventories = 1;
}

message PickingKeyDefinition {
  int32 keyNo = 1;  // 1..7
  bool inUse = 2;
  string name = 3;
  string dataType = 4;
  int32 maxLength = 5;
  string dateFormat = 6;
  bool requiredOnReceipt = 7;
  bool requiredOnShip = 8;
  bool expiryControl = 9;
}

message ListPickingKeyDefinitionsResponse {
  repeated PickingKeyDefinition definitions = 1;
}

message TransactionKind {
  string code = 1;
  string name = 2;
  repeated string usages = 3;        // RECEIPT, SHIP, ADJUST, RELOCATE …
  repeated string chargeTypes = 4;  // IN, OUT, STORAGE, PROCESSING
  bool reasonRequired = 5;
  bool allowSurplus = 6;
  bool allowShortage = 7;
}

message ListTransactionKindsRequest {
  string usage = 1;  // filter, e.g. ADJUST
}

message ListTransactionKindsResponse {
  repeated TransactionKind kinds = 1;
}

message Status {
  string businessCode = 1;  // AV, SP, STK
  string statusCode = 2;
  string labelKey = 3;
}

message ProcessControl {
  string processCode = 1;
  string requiredStatus = 2;
  string processingStatus = 3;
  string finishedStatus = 4;
}

message ListStatusesRequest {
  string businessCode = 1;
}

message ListStatusesResponse {
  repeated Status statuses = 1;
  repeated ProcessControl processControls = 2;
}

message Code {
  string kind = 1;
  string code = 2;
  string labelKey = 3;
  int32 sortOrder = 4;
  google.protobuf.Struct attributes = 5;
}

message ListCodesRequest {
  string kind = 1;  // e.g. REASON
}

message ListCodesResponse {
  repeated Code codes = 1;
}

message GetEffectiveSettingsRequest {
  repeated string keys = 1;  // empty = all
}

message GetEffectiveSettingsResponse {
  google.protobuf.Struct settings = 1;
}
