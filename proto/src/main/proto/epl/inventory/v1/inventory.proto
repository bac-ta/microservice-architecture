syntax = "proto3";

// Inventory: stock lots, movements, stocktake, serials, kitting.
// Schema: inv.
// RPC names match iam.action.grpc_method, so each call maps to one ABAC action.
package epl.inventory.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.example.epl.inventory.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Stock
// ---------------------------------------------------------------------------
service StockService {
  // screens: EPL-IV-110W, EPL-IV-110H
  rpc Search(SearchStockRequest) returns (SearchStockResponse);
  // screens: EPL-IV-110W, EPL-IV-110H
  rpc Get(GetStockRequest) returns (StockLot);
  // screens: EPL-IV-120W
  rpc Adjust(AdjustStockRequest) returns (MovementResult);
  // screens: EPL-IV-130W, EPL-IV-130H
  rpc Relocate(RelocateStockRequest) returns (MovementResult);
  // screens: EPL-IV-140W, EPL-IV-140H
  rpc ChangePickKey(ChangePickKeyRequest) returns (MovementResult);
  // screens: EPL-IV-150W
  rpc ChangeSubInventory(ChangeSubInventoryRequest) returns (MovementResult);
  // screens: EPL-IV-160W
  rpc Divide(DivideStockRequest) returns (MovementResult);
  // screens: EPL-IV-110W
  rpc Export(SearchStockRequest) returns (stream StockLot);
}

message StockLot {
  string id = 1;
  epl.common.v1.ReceiptRef receipt = 2;
  string stock_kind = 3;
  epl.common.v1.Date received_on = 4;
  string product_code = 5;
  string origin_country = 6;
  epl.common.v1.PickKeys pick_keys = 7;
  string location_code = 8;
  string area_code = 9;
  string sub_inventory_code = 10;
  epl.common.v1.Decimal physical_qty = 11;   // = available + allocated
  epl.common.v1.Decimal available_qty = 12;
  epl.common.v1.Decimal allocated_qty = 13;
  int32 units_per_case = 14;
  int32 units_per_ball = 15;
  bool bonded = 16;
  bool on_hold = 17;
  bool locked = 18;
  google.protobuf.Struct ext = 19;
  int32 version = 20;
}

message SearchStockRequest {
  epl.common.v1.PageRequest page = 1;
  string product_code = 2;
  string location_code_from = 3;
  string location_code_to = 4;
  string area_code = 5;
  string sub_inventory_code = 6;
  epl.common.v1.PickKeys pick_keys = 7;  // non-empty keys are filters
  epl.common.v1.ReceiptRef receipt = 8;
  bool only_available = 9;
  bool include_zero = 10;
}

message GetStockRequest {
  string id = 1;
}

message SearchStockResponse {
  repeated StockLot lots = 1;
  epl.common.v1.PageResponse page = 2;
}

// Result of any stock-changing call: the ledger rows written.
message MovementResult {
  string operation_no = 1;
  repeated Movement movements = 2;
  repeated epl.common.v1.RowError errors = 3;
}

message AdjustStockRequest {
  message Line {
    string stock_id = 1;
    int32 stock_version = 2;
    epl.common.v1.Decimal delta_qty = 3;  // + increase / - decrease, in pieces
  }
  string transaction_kind = 1;  // usage ADJUST
  string reason_code = 2;       // required when the transaction kind asks for a reason
  string remarks = 3;
  repeated Line lines = 4;
}

message RelocateStockRequest {
  message Line {
    string stock_id = 1;
    int32 stock_version = 2;
    epl.common.v1.Decimal qty = 3;  // empty = whole lot
    string to_location_code = 4;
  }
  string transaction_kind = 1;  // usage RELOCATE
  string reason_code = 2;
  string remarks = 3;
  repeated Line lines = 4;
}

message ChangePickKeyRequest {
  string stock_id = 1;
  int32 stock_version = 2;
  epl.common.v1.Decimal qty = 3;
  epl.common.v1.PickKeys new_pick_keys = 4;
  optional bool lock = 5;  // HHT lock / unlock cargo ID
  string transaction_kind = 6;
  string reason_code = 7;
}

message ChangeSubInventoryRequest {
  string stock_id = 1;
  int32 stock_version = 2;
  epl.common.v1.Decimal qty = 3;
  string to_sub_inventory_code = 4;
  optional bool on_hold = 5;
  string reason_code = 6;
}

message DivideStockRequest {
  string stock_id = 1;
  int32 stock_version = 2;
  repeated epl.common.v1.Decimal split_qty = 3;  // one new lot (cargo ID) per entry
}

// ---------------------------------------------------------------------------
// Movement ledger / in-out history
// ---------------------------------------------------------------------------
service MovementService {
  // screens: EPL-IV-210W
  rpc Search(SearchMovementsRequest) returns (SearchMovementsResponse);
  // screens: EPL-IV-210W
  rpc Export(SearchMovementsRequest) returns (stream Movement);
}

message Movement {
  string id = 1;
  string operation_no = 2;
  int32 operation_line = 3;
  int32 operation_seq = 4;
  string movement_type = 5;  // ADJUST, RELOCATE, PICK_KEY_CHANGE, SUB_INVENTORY_CHANGE, DIVIDE, STOCKTAKE, RECEIPT, SHIPMENT
  string leg = 6;            // FROM / TO / SINGLE
  string transaction_kind = 7;
  epl.common.v1.Date operation_date = 8;
  string stock_id = 9;
  epl.common.v1.ReceiptRef receipt = 10;
  string product_code = 11;
  epl.common.v1.PickKeys pick_keys = 12;
  string location_code = 13;
  string sub_inventory_code = 14;
  epl.common.v1.Quantity quantity = 15;  // total_pieces signed: + in, - out
  string reason_code = 16;
  string remarks = 17;
  string source_ref = 18;
  google.protobuf.Timestamp created_at = 19;
  string created_by = 20;
}

message SearchMovementsRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date date_from = 2;
  epl.common.v1.Date date_to = 3;
  repeated string movement_types = 4;
  string product_code = 5;
  string location_code = 6;
  string operation_no = 7;
  epl.common.v1.ReceiptRef receipt = 8;
}

message SearchMovementsResponse {
  repeated Movement movements = 1;
  epl.common.v1.PageResponse page = 2;
}

// ---------------------------------------------------------------------------
// Stocktake
// ---------------------------------------------------------------------------
service StocktakeService {
  // screens: EPL-IV-320W
  rpc Create(CreateStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-310W
  rpc Get(GetStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-310W
  rpc List(ListStocktakesRequest) returns (ListStocktakesResponse);
  // Header only, while the stocktake is INSTRUCTED.
  // screens: EPL-IV-320W
  rpc Update(UpdateStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-330W, EPL-IV-330H
  rpc RecordCount(RecordCountRequest) returns (RecordCountResponse);
  // screens: EPL-IV-340W
  rpc Confirm(ConfirmStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-340W
  rpc Cancel(CancelStocktakeRequest) returns (Stocktake);
}

enum StocktakeStatus {
  STOCKTAKE_STATUS_UNSPECIFIED = 0;
  STOCKTAKE_STATUS_INSTRUCTED = 1;
  STOCKTAKE_STATUS_COUNTING = 2;
  STOCKTAKE_STATUS_COUNTED = 3;
  STOCKTAKE_STATUS_CONFIRMED = 4;
  STOCKTAKE_STATUS_CANCELLED = 5;
}

message StocktakeLine {
  string id = 1;
  int32 count_no = 2;
  string stock_id = 3;  // empty = found stock / empty location
  epl.common.v1.ReceiptRef receipt = 4;
  string product_code = 5;
  epl.common.v1.PickKeys pick_keys = 6;
  string location_code = 7;
  string sub_inventory_code = 8;
  epl.common.v1.Quantity book = 9;
  epl.common.v1.Quantity counted = 10;
  epl.common.v1.Decimal diff_total_qty = 11;
  string remarks = 12;
  int32 version = 13;
}

message Stocktake {
  string id = 1;
  string stocktake_no = 2;
  epl.common.v1.Date stocktake_date = 3;
  epl.common.v1.Date confirmed_date = 4;
  StocktakeStatus status = 5;
  string kind = 6;
  string target_kind = 7;
  bool include_empty_locations = 8;
  bool update_stock_on_confirm = 9;
  google.protobuf.Struct criteria = 10;  // location ranges, product, ABC …
  epl.common.v1.Decimal planned_qty = 11;
  epl.common.v1.Decimal counted_qty = 12;
  repeated StocktakeLine lines = 13;     // filled by Get only
  epl.common.v1.Audit audit = 14;
}

message CreateStocktakeRequest {
  Stocktake stocktake = 1;  // stocktake_no empty = numbered by the server
}

message UpdateStocktakeRequest {
  Stocktake stocktake = 1;  // identified by stocktake_no, audit.version required
}

message GetStocktakeRequest {
  string stocktake_no = 1;
  bool only_differences = 2;
}

message ListStocktakesRequest {
  epl.common.v1.PageRequest page = 1;
  repeated StocktakeStatus statuses = 2;
  epl.common.v1.Date date_from = 3;
  epl.common.v1.Date date_to = 4;
}

message ListStocktakesResponse {
  repeated Stocktake stocktakes = 1;
  epl.common.v1.PageResponse page = 2;
}

message RecordCountRequest {
  string stocktake_no = 1;
  repeated StocktakeLine lines = 2;  // counted quantities; new lines for found stock
  string entry_kind = 3;             // PC / HHT / UPLOAD
}

message RecordCountResponse {
  repeated epl.common.v1.RowError errors = 1;
}

message ConfirmStocktakeRequest {
  string stocktake_no = 1;
  int32 version = 2;
}

message CancelStocktakeRequest {
  string stocktake_no = 1;
  int32 version = 2;
}

// ---------------------------------------------------------------------------
// Serial numbers
// ---------------------------------------------------------------------------
service SerialService {
  // screens: EPL-IV-410W
  rpc Search(SearchSerialsRequest) returns (SearchSerialsResponse);
  // screens: EPL-IV-420W, EPL-IV-420H
  rpc Register(RegisterSerialsRequest) returns (RegisterSerialsResponse);
}

message Serial {
  string serial_no = 1;
  string product_code = 2;
  epl.common.v1.ReceiptRef receipt = 3;
  string status = 4;
  string doc_kind = 5;  // AV / SP
  string doc_no = 6;
  string carton_id = 7;
}

message SearchSerialsRequest {
  epl.common.v1.PageRequest page = 1;
  string serial_no = 2;
  string product_code = 3;
  string doc_no = 4;
}

message SearchSerialsResponse {
  repeated Serial serials = 1;
  epl.common.v1.PageResponse page = 2;
}

message RegisterSerialsRequest {
  repeated Serial serials = 1;
}

message RegisterSerialsResponse {
  repeated epl.common.v1.RowError errors = 1;
}

// ---------------------------------------------------------------------------
// Kitting (set assembly)
// ---------------------------------------------------------------------------
service KittingService {
  // screens: EPL-IV-510W
  rpc CreateOrder(CreateKittingOrderRequest) returns (KittingOrder);
  // screens: EPL-IV-520W
  rpc Receive(ReceiveKittingRequest) returns (KittingOrder);
  // screens: EPL-IV-530W
  rpc SendConfirmation(SendKittingConfirmationRequest) returns (google.protobuf.Empty);
}

message KittingOrder {
  string order_no = 1;
  string kit_product_code = 2;
  epl.common.v1.Decimal kit_qty = 3;
  string status = 4;
  string component_shipment_no = 5;  // outbound document for the components
  string kit_arrival_no = 6;         // inbound document for the finished kits
  epl.common.v1.Audit audit = 7;
}

message CreateKittingOrderRequest {
  string kit_product_code = 1;
  epl.common.v1.Decimal kit_qty = 2;
  epl.common.v1.Date scheduled_date = 3;
}

message ReceiveKittingRequest {
  string order_no = 1;
  epl.common.v1.Decimal received_qty = 2;
  string location_code = 3;
}

message SendKittingConfirmationRequest {
  repeated string order_nos = 1;
}
