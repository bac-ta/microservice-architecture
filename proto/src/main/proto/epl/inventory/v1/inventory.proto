syntax = "proto3";

// Inventory: stock lots, movements, stocktake, serials, kitting.
// Schema: inv.
// RPC names match iam.action.grpc_method, so each call maps to one ABAC action.
package epl.inventory.v1;

import "epl/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.epl.inventory.v1";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Stock
// ---------------------------------------------------------------------------
service StockService {
  // screens: EPL-IV-110W, EPL-IV-110H
  rpc Search(SearchStockRequest) returns (SearchStockResponse);
  // screens: EPL-IV-110W, EPL-IV-110H
  rpc Get(GetStockRequest) returns (StockLot);
  // screens: EPL-IV-120W
  rpc Adjust(AdjustStockRequest) returns (MovementResult);
  // screens: EPL-IV-130W, EPL-IV-130H
  rpc Relocate(RelocateStockRequest) returns (MovementResult);
  // screens: EPL-IV-140W, EPL-IV-140H
  rpc ChangePickKey(ChangePickKeyRequest) returns (MovementResult);
  // screens: EPL-IV-150W
  rpc ChangeSubInventory(ChangeSubInventoryRequest) returns (MovementResult);
  // screens: EPL-IV-160W
  rpc Divide(DivideStockRequest) returns (MovementResult);
  // screens: EPL-IV-110W
  rpc Export(SearchStockRequest) returns (stream StockLot);
}

message StockLot {
  string id = 1;
  epl.common.v1.ReceiptRef receipt = 2;
  string stockKind = 3;
  epl.common.v1.Date receivedOn = 4;
  string productCode = 5;
  string originCountry = 6;
  epl.common.v1.PickKeys pickKeys = 7;   // keys of the lot (lotId)
  string locationCode = 8;
  string areaCode = 9;
  string subInventoryCode = 10;
  epl.common.v1.Decimal physicalQty = 11;   // = available + allocated
  epl.common.v1.Decimal availableQty = 12;
  epl.common.v1.Decimal allocatedQty = 13;
  int32 unitsPerCase = 14;
  int32 unitsPerBall = 15;
  bool bonded = 16;
  bool onHold = 17;
  bool locked = 18;
  google.protobuf.Struct ext = 19;
  int32 version = 20;
  string lotId = 21;                     // same lot <=> same lotId
  string lotNo = 22;                     // the key the tenant defines as lot number
  epl.common.v1.Date expiryDate = 23;    // the key with expiry control
}

message SearchStockRequest {
  epl.common.v1.PageRequest page = 1;
  string productCode = 2;
  string locationCodeFrom = 3;
  string locationCodeTo = 4;
  string areaCode = 5;
  string subInventoryCode = 6;
  epl.common.v1.PickKeys pickKeys = 7;  // non-empty keys are filters
  epl.common.v1.ReceiptRef receipt = 8;
  bool onlyAvailable = 9;
  bool includeZero = 10;
}

message GetStockRequest {
  string id = 1;
}

message SearchStockResponse {
  repeated StockLot lots = 1;
  epl.common.v1.PageResponse page = 2;
}

// Result of any stock-changing call: the ledger rows written.
message MovementResult {
  string operationNo = 1;
  repeated Movement movements = 2;
  repeated epl.common.v1.RowError errors = 3;
}

message AdjustStockRequest {
  message Line {
    string stockId = 1;
    int32 stockVersion = 2;
    epl.common.v1.Decimal deltaQty = 3;  // + increase / - decrease, in pieces
  }
  string transactionKind = 1;  // usage ADJUST
  string reasonCode = 2;       // required when the transaction kind asks for a reason
  string remarks = 3;
  repeated Line lines = 4;
}

message RelocateStockRequest {
  message Line {
    string stockId = 1;
    int32 stockVersion = 2;
    epl.common.v1.Decimal qty = 3;  // empty = whole lot
    string toLocationCode = 4;
  }
  string transactionKind = 1;  // usage RELOCATE
  string reasonCode = 2;
  string remarks = 3;
  repeated Line lines = 4;
}

message ChangePickKeyRequest {
  string stockId = 1;
  int32 stockVersion = 2;
  epl.common.v1.Decimal qty = 3;
  epl.common.v1.PickKeys newPickKeys = 4;
  optional bool lock = 5;  // mobile lock / unlock cargo ID
  string transactionKind = 6;
  string reasonCode = 7;
}

message ChangeSubInventoryRequest {
  string stockId = 1;
  int32 stockVersion = 2;
  epl.common.v1.Decimal qty = 3;
  string toSubInventoryCode = 4;
  optional bool onHold = 5;
  string reasonCode = 6;
}

message DivideStockRequest {
  string stockId = 1;
  int32 stockVersion = 2;
  repeated epl.common.v1.Decimal splitQty = 3;  // one new lot (cargo ID) per entry
}

// ---------------------------------------------------------------------------
// Movement ledger / in-out history
// ---------------------------------------------------------------------------
service MovementService {
  // screens: EPL-IV-210W
  rpc Search(SearchMovementsRequest) returns (SearchMovementsResponse);
  // screens: EPL-IV-210W
  rpc Export(SearchMovementsRequest) returns (stream Movement);
}

message Movement {
  string id = 1;
  string operationNo = 2;
  int32 operationLine = 3;
  int32 operationSeq = 4;
  string movementType = 5;  // ADJUST, RELOCATE, PICK_KEY_CHANGE, SUB_INVENTORY_CHANGE, DIVIDE, STOCKTAKE, RECEIPT, SHIPMENT
  string leg = 6;            // FROM / TO / SINGLE
  string transactionKind = 7;
  epl.common.v1.Date operationDate = 8;
  string stockId = 9;
  epl.common.v1.ReceiptRef receipt = 10;
  string productCode = 11;
  epl.common.v1.PickKeys pickKeys = 12;
  string locationCode = 13;
  string subInventoryCode = 14;
  epl.common.v1.Quantity quantity = 15;  // totalPieces signed: + in, - out
  string reasonCode = 16;
  string remarks = 17;
  string sourceRef = 18;
  google.protobuf.Timestamp createdAt = 19;
  string createdBy = 20;
}

message SearchMovementsRequest {
  epl.common.v1.PageRequest page = 1;
  epl.common.v1.Date dateFrom = 2;
  epl.common.v1.Date dateTo = 3;
  repeated string movementTypes = 4;
  string productCode = 5;
  string locationCode = 6;
  string operationNo = 7;
  epl.common.v1.ReceiptRef receipt = 8;
}

message SearchMovementsResponse {
  repeated Movement movements = 1;
  epl.common.v1.PageResponse page = 2;
}

// ---------------------------------------------------------------------------
// Stocktake
// ---------------------------------------------------------------------------
service StocktakeService {
  // screens: EPL-IV-320W
  rpc Create(CreateStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-310W
  rpc Get(GetStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-310W
  rpc List(ListStocktakesRequest) returns (ListStocktakesResponse);
  // Header only, while the stocktake is INSTRUCTED.
  // screens: EPL-IV-320W
  rpc Update(UpdateStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-330W, EPL-IV-330H
  rpc RecordCount(RecordCountRequest) returns (RecordCountResponse);
  // screens: EPL-IV-340W
  rpc Confirm(ConfirmStocktakeRequest) returns (Stocktake);
  // screens: EPL-IV-340W
  rpc Cancel(CancelStocktakeRequest) returns (Stocktake);
}

enum StocktakeStatus {
  STOCKTAKE_STATUS_UNSPECIFIED = 0;
  STOCKTAKE_STATUS_INSTRUCTED = 1;
  STOCKTAKE_STATUS_COUNTING = 2;
  STOCKTAKE_STATUS_COUNTED = 3;
  STOCKTAKE_STATUS_CONFIRMED = 4;
  STOCKTAKE_STATUS_CANCELLED = 5;
}

message StocktakeLine {
  string id = 1;
  int32 countNo = 2;
  string stockId = 3;  // empty = found stock / empty location
  epl.common.v1.ReceiptRef receipt = 4;
  string productCode = 5;
  epl.common.v1.PickKeys pickKeys = 6;
  string locationCode = 7;
  string subInventoryCode = 8;
  epl.common.v1.Quantity book = 9;
  epl.common.v1.Quantity counted = 10;
  epl.common.v1.Decimal diffTotalQty = 11;
  string remarks = 12;
  int32 version = 13;
  string lotId = 14;  // empty = empty location / found stock without a lot yet
}

message Stocktake {
  string id = 1;
  string stocktakeNo = 2;
  epl.common.v1.Date stocktakeDate = 3;
  epl.common.v1.Date confirmedDate = 4;
  StocktakeStatus status = 5;
  string kind = 6;
  string targetKind = 7;
  bool includeEmptyLocations = 8;
  bool updateStockOnConfirm = 9;
  google.protobuf.Struct criteria = 10;  // location ranges, product, ABC …
  epl.common.v1.Decimal plannedQty = 11;
  epl.common.v1.Decimal countedQty = 12;
  repeated StocktakeLine lines = 13;     // filled by Get only
  epl.common.v1.Audit audit = 14;
}

message CreateStocktakeRequest {
  Stocktake stocktake = 1;  // stocktakeNo empty = numbered by the server
}

message UpdateStocktakeRequest {
  Stocktake stocktake = 1;  // identified by stocktakeNo, audit.version required
}

message GetStocktakeRequest {
  string stocktakeNo = 1;
  bool onlyDifferences = 2;
}

message ListStocktakesRequest {
  epl.common.v1.PageRequest page = 1;
  repeated StocktakeStatus statuses = 2;
  epl.common.v1.Date dateFrom = 3;
  epl.common.v1.Date dateTo = 4;
}

message ListStocktakesResponse {
  repeated Stocktake stocktakes = 1;
  epl.common.v1.PageResponse page = 2;
}

message RecordCountRequest {
  string stocktakeNo = 1;
  repeated StocktakeLine lines = 2;  // counted quantities; new lines for found stock
  string entryKind = 3;             // PC / MOBILE / UPLOAD
}

message RecordCountResponse {
  repeated epl.common.v1.RowError errors = 1;
}

message ConfirmStocktakeRequest {
  string stocktakeNo = 1;
  int32 version = 2;
}

message CancelStocktakeRequest {
  string stocktakeNo = 1;
  int32 version = 2;
}

// ---------------------------------------------------------------------------
// Serial numbers
// ---------------------------------------------------------------------------
service SerialService {
  // screens: EPL-IV-410W
  rpc Search(SearchSerialsRequest) returns (SearchSerialsResponse);
  // screens: EPL-IV-420W, EPL-IV-420H
  rpc Register(RegisterSerialsRequest) returns (RegisterSerialsResponse);
}

message Serial {
  string serialNo = 1;
  string productCode = 2;
  epl.common.v1.ReceiptRef receipt = 3;
  string status = 4;
  string docKind = 5;  // AV / SP
  string docNo = 6;
  string cartonId = 7;
}

message SearchSerialsRequest {
  epl.common.v1.PageRequest page = 1;
  string serialNo = 2;
  string productCode = 3;
  string docNo = 4;
}

message SearchSerialsResponse {
  repeated Serial serials = 1;
  epl.common.v1.PageResponse page = 2;
}

message RegisterSerialsRequest {
  repeated Serial serials = 1;
}

message RegisterSerialsResponse {
  repeated epl.common.v1.RowError errors = 1;
}

// ---------------------------------------------------------------------------
// Kitting (set assembly)
// ---------------------------------------------------------------------------
service KittingService {
  // screens: EPL-IV-510W
  rpc CreateOrder(CreateKittingOrderRequest) returns (KittingOrder);
  // screens: EPL-IV-520W
  rpc Receive(ReceiveKittingRequest) returns (KittingOrder);
  // screens: EPL-IV-530W
  rpc SendConfirmation(SendKittingConfirmationRequest) returns (google.protobuf.Empty);
}

message KittingOrder {
  string orderNo = 1;
  string kitProductCode = 2;
  epl.common.v1.Decimal kitQty = 3;
  string status = 4;
  string componentShipmentNo = 5;  // outbound document for the components
  string kitArrivalNo = 6;         // inbound document for the finished kits
  epl.common.v1.Audit audit = 7;
}

message CreateKittingOrderRequest {
  string kitProductCode = 1;
  epl.common.v1.Decimal kitQty = 2;
  epl.common.v1.Date scheduledDate = 3;
}

message ReceiveKittingRequest {
  string orderNo = 1;
  epl.common.v1.Decimal receivedQty = 2;
  string locationCode = 3;
}

message SendKittingConfirmationRequest {
  repeated string orderNos = 1;
}
