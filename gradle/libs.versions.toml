# Single place for every version used in the build.
# Spring-managed artifacts (spring-boot-*, spring-cloud-*, jackson, postgresql …) take their
# version from the Spring Boot / Spring Cloud BOMs imported in epl.java-conventions.

[versions]
spring-boot = "3.3.0"
spring-dependency-management = "1.1.5"
spring-cloud = "2023.0.3"            # Spring Cloud train for Boot 3.2 / 3.3 (commons 4.1.4, config 4.1.3)
grpc = "1.72.0"
protobuf = "3.25.5"           # must match grpc-java (1.72 is built on protobuf 3.25.5)
protobuf-plugin = "0.9.4"
commons-lang3 = "3.14.0"
javax-annotation = "1.3.2"
testcontainers = "1.21.4"       # newer than the Boot 3.3 BOM (1.19.8): Docker Engine 29 needs Docker API >= 1.40
spring-security-oauth2-legacy = "2.5.2.RELEASE"   # end-of-life; used by libs/security RequestHandlerInterceptor

[libraries]
# gRPC / protobuf
grpc-all = { module = "io.grpc:grpc-all", version.ref = "grpc" }
grpc-core = { module = "io.grpc:grpc-core", version.ref = "grpc" }
grpc-util = { module = "io.grpc:grpc-util", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }

# Spring (versions from the BOMs)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-cloud-starter = { module = "org.springframework.cloud:spring-cloud-starter" }
spring-security-oauth2-legacy = { module = "org.springframework.security.oauth:spring-security-oauth2", version.ref = "spring-security-oauth2-legacy" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

# Misc
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Gradle plugins, used by build-logic
gradle-plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradle-plugin-spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
gradle-plugin-protobuf = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
