// Common setup for every Java module: Java 21, Spring Boot + Spring Cloud BOMs, Lombok, JUnit 5.
plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

def catalog = versionCatalogs.named('libs')

group = 'com.epl'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${catalog.findVersion('spring-boot').get()}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${catalog.findVersion('spring-cloud').get()}"
    }
    // newer than the BOMs' 1.19.8: Docker Engine 29 needs Docker API >= 1.40
    dependencies {
        dependencySet(group: 'org.testcontainers', version: catalog.findVersion('testcontainers').get().requiredVersion) {
            entry 'testcontainers'
            entry 'database-commons'
            entry 'jdbc'
            entry 'postgresql'
            entry 'junit-jupiter'
            entry 'kafka'
        }
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // database tests read bootstrap.sql and other services' migrations from the source tree
    systemProperty 'epl.repository.root', rootDir.absolutePath
}
